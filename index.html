<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Photoshop</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#f8fafc;font:15px system-ui,sans-serif}header{padding:15px 20px;background:#1e293b;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}h1{margin:0;font-size:22px}main{display:grid;grid-template-columns:265px 1fr;min-height:calc(100vh - 70px)}aside{padding:17px;background:#1e293b;display:grid;align-content:start;gap:17px}section{display:grid;gap:9px}h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#94a3b8;margin:0}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,.upload{background:#334155;border:1px solid #475569;border-radius:8px;color:white;padding:9px 11px;cursor:pointer;font:inherit;text-align:center}button:hover,.upload:hover{background:#475569}.primary{background:#2563eb;border-color:#2563eb}.top{display:flex;gap:8px;flex-wrap:wrap}.setting{display:grid;gap:4px;font-size:13px}.setting span{display:flex;justify-content:space-between}input[type=range]{width:100%;accent-color:#60a5fa}input[type=color]{width:100%;height:35px}.workspace{display:grid;place-content:center;justify-items:center;gap:15px;padding:20px;background-image:radial-gradient(#263244 1px,transparent 1px);background-size:18px 18px;min-width:0}canvas{background:white;max-width:100%;max-height:75vh;object-fit:contain;box-shadow:0 12px 40px #0007;touch-action:none}.hint{font-size:12px;color:#94a3b8;text-align:center}@media(max-width:700px){main{grid-template-columns:1fr}aside{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{min-height:50vh}canvas{max-height:55vh}}@media(max-width:420px){aside{grid-template-columns:1fr}}
</style></head><body>
<header><h1>🎨 Mini Photoshop</h1><div class="top"><label class="upload primary" for="file">📂 Открыть фото</label><input type="file" id="file" accept="image/*" hidden><button id="save" class="primary">⬇ Скачать PNG</button></div></header>
<main><aside><section><h2>Инструменты</h2><div class="buttons"><button data-tool="brush">🖌 Кисть</button><button data-tool="eraser">🧽 Ластик</button><button data-tool="crop">✂ Обрезка</button><button data-tool="none">✋ Просмотр</button></div><label class="setting">Цвет кисти<input type="color" id="color" value="#ff416c"></label><label class="setting"><span>Размер кисти <output id="sizeValue">12</output></span><input type="range" id="size" min="1" max="100" value="12"></label><button id="cropApply" disabled>Применить обрезку</button></section>
<section><h2>Коррекция</h2><label class="setting"><span>Яркость <output id="brightnessValue">100%</output></span><input type="range" id="brightness" min="0" max="200" value="100"></label><label class="setting"><span>Контраст <output id="contrastValue">100%</output></span><input type="range" id="contrast" min="0" max="200" value="100"></label><label class="setting"><span>Насыщенность <output id="saturateValue">100%</output></span><input type="range" id="saturate" min="0" max="200" value="100"></label><div class="buttons"><button data-filter="normal">Обычный</button><button data-filter="grayscale">Ч/Б</button><button data-filter="sepia">Сепия</button><button data-filter="invert">Негатив</button></div><button id="apply">Применить фильтры</button></section>
<section><h2>Изображение</h2><div class="buttons"><button id="left">↶ Повернуть</button><button id="right">↷ Повернуть</button><button id="flip">⇄ Отразить</button><button id="undo">↩ Отменить</button><button id="redo">↪ Повторить</button><button id="reset">⟲ Сбросить</button></div></section></aside>
<div class="workspace"><canvas id="canvas" width="900" height="550"></canvas><div id="status" class="hint">Откройте фото или рисуйте на холсте. Работает на телефоне.</div></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
let tool='brush',drawing=false,last=null,cropStart=null,cropPreview=null,cropRect=null,original=null,history=[],future=[],filter='normal';
const snap=()=>({w:canvas.width,h:canvas.height,pixels:ctx.getImageData(0,0,canvas.width,canvas.height)});
function restore(s){canvas.width=s.w;canvas.height=s.h;ctx.putImageData(s.pixels,0,0);cropRect=null;$('cropApply').disabled=true}
function remember(){history.push(snap());if(history.length>25)history.shift();future=[]}
function undo(){if(history.length){future.push(snap());restore(history.pop())}}function redo(){if(future.length){history.push(snap());restore(future.pop())}}
$('undo').onclick=undo;$('redo').onclick=redo;
ctx.fillStyle='#fff';ctx.fillRect(0,0,900,550);ctx.fillStyle='#64748b';ctx.textAlign='center';ctx.font='bold 35px system-ui';ctx.fillText('Mini Photoshop',450,260);ctx.font='18px system-ui';ctx.fillText('Откройте фотографию или начните рисовать',450,300);
const sliders=['brightness','contrast','saturate'];
function filterText(){return 'brightness('+$('brightness').value+'%) contrast('+$('contrast').value+'%) saturate('+$('saturate').value+'%) '+({normal:'',grayscale:'grayscale(1)',sepia:'sepia(1)',invert:'invert(1)'}[filter])}
function render(){canvas.style.filter=filterText()}
function clearFilters(){sliders.forEach(id=>{$(id).value=100;$(id+'Value').textContent='100%'});filter='normal';render()}
sliders.forEach(id=>$(id).oninput=()=>{$(id+'Value').textContent=$(id).value+'%';render()});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
$('apply').onclick=()=>{remember();const t=document.createElement('canvas');t.width=canvas.width;t.height=canvas.height;const c=t.getContext('2d');c.filter=filterText();c.drawImage(canvas,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(t,0,0);clearFilters()};
$('size').oninput=()=>{$('sizeValue').textContent=$('size').value};
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.style.outline=b.dataset.tool===t?'2px solid #60a5fa':'none')}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));setTool('brush');
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function stroke(a,b){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=+$('size').value;if(tool==='eraser')ctx.globalCompositeOperation='destination-out';else ctx.strokeStyle=$('color').value;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}
canvas.onpointerdown=e=>{if(tool==='none')return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;last=point(e);if(tool==='crop'){cropStart=last;cropPreview=snap()}else{remember();stroke(last,last)}};
canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);if(tool==='crop'){ctx.putImageData(cropPreview.pixels,0,0);cropRect={x:Math.min(cropStart.x,p.x),y:Math.min(cropStart.y,p.y),w:Math.abs(p.x-cropStart.x),h:Math.abs(p.y-cropStart.y)};ctx.save();ctx.strokeStyle='#2563eb';ctx.lineWidth=Math.max(2,canvas.width/400);ctx.setLineDash([10,6]);ctx.strokeRect(cropRect.x,cropRect.y,cropRect.w,cropRect.h);ctx.restore();$('cropApply').disabled=false}else{stroke(last,p);last=p}};
canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false};
$('cropApply').onclick=()=>{if(!cropRect||cropRect.w<2||cropRect.h<2)return;ctx.putImageData(cropPreview.pixels,0,0);remember();const {x,y,w,h}=cropRect,t=document.createElement('canvas');t.width=Math.round(w);t.height=Math.round(h);t.getContext('2d').drawImage(canvas,x,y,w,h,0,0,t.width,t.height);canvas.width=t.width;canvas.height=t.height;ctx.drawImage(t,0,0);cropRect=null;$('cropApply').disabled=true;setTool('none')};
function transform(kind){remember();const t=document.createElement('canvas'),turn=kind!=='flip';t.width=turn?canvas.height:canvas.width;t.height=turn?canvas.width:canvas.height;const c=t.getContext('2d');if(kind==='left'){c.translate(0,t.height);c.rotate(-Math.PI/2)}else if(kind==='right'){c.translate(t.width,0);c.rotate(Math.PI/2)}else{c.translate(t.width,0);c.scale(-1,1)}c.drawImage(canvas,0,0);canvas.width=t.width;canvas.height=t.height;ctx.drawImage(t,0,0)}
$('left').onclick=()=>transform('left');$('right').onclick=()=>transform('right');$('flip').onclick=()=>transform('flip');
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{const scale=Math.min(1,2500/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));ctx.drawImage(img,0,0,canvas.width,canvas.height);original=snap();history=[];future=[];clearFilters();$('status').textContent=f.name+' · '+canvas.width+' × '+canvas.height;URL.revokeObjectURL(url)};img.onerror=()=>{alert('Не удалось открыть изображение');URL.revokeObjectURL(url)};img.src=url};
$('reset').onclick=()=>{if(original){remember();restore(original);clearFilters()}};
$('save').onclick=()=>{const t=document.createElement('canvas');t.width=canvas.width;t.height=canvas.height;const c=t.getContext('2d');c.filter=filterText();c.drawImage(canvas,0,0);t.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mini-photoshop.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});
</script></body></html>
